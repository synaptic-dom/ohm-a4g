<template>
    <section class={hostClass} aria-label="Agent bundles">
        <header class="fleet__heading"><div><p class="eyebrow">Your workspace</p><h1>Agent bundles.</h1><p class="fleet__intro">Your published agents and their linked prompts. Start with a review, leave with a next step.</p></div><button class="button button--quiet" onclick={handleRetry} disabled={isLoading}>Refresh <span aria-hidden="true">↻</span></button></header>
        <template for:each={progressRuns} for:item="run"><c-ohm-audit-progress key={run.plannerId} run={run} onretry={handleRunRetry}></c-ohm-audit-progress></template>
        <template lwc:if={isLoading}><c-ohm-loading-state data-id="loading" heading="Finding your bundles" detail="Reading published agents and their latest reviews."></c-ohm-loading-state></template>
        <template lwc:elseif={loadError}><div class="fleet__state" data-id="load-error" role="alert"><p>{loadError}</p><button class="button" onclick={handleRetry}>Try again →</button></div></template>
        <template lwc:else>
            <div class="fleet__toolbar">
                <label class="fleet__search"><span class="sr-only">Search bundles</span><input data-id="search" type="search" placeholder="Search bundles" value={searchTerm} oninput={handleSearch} /></label>
                <label><span class="sr-only">Filter by review rating</span><select data-id="filter-grade" onchange={handleGradeChange}><template for:each={gradeOptions} for:item="option"><option key={option.value} value={option.value} selected={option.selected}>{option.label}</option></template></select></label>
                <span class="fleet__count"><strong data-id="stat-audited">{auditedCount}/{discoveredCount}</strong> reviewed</span>
            </div>
            <template lwc:if={hasRows}>
                <div class="fleet__list" data-id="table">
                    <template for:each={visibleRows} for:item="row">
                        <article key={row.plannerId} class="fleet__bundle" data-id="row">
                            <div class="fleet__identity"><span class="fleet__icon" aria-hidden="true">◇</span><div><h2>{row.displayLabel}</h2><p>{row.topicText} {row.topicNoun} <span aria-hidden="true">·</span> {row.actionText} {row.actionNoun}</p><template lwc:if={row.opportunityLabel}><span class="fleet__opportunity">{row.opportunityLabel}</span></template></div></div>
                            <div class="fleet__ratings">
                                <template lwc:if={row.hasReview}><div class="ohm-fleet__review-chips" data-id="review-chips"><template for:each={row.reviewCategories} for:item="category"><span key={category.id} class={category.chipCss} title={category.accessibleLabel}><span>{category.shortLabel}</span><strong>{category.rating}</strong></span></template></div></template>
                                <template lwc:else><span class="fleet__muted" data-id="review-state">{row.reviewStateLabel}</span></template>
                                <template lwc:if={row.hasPriorResults}><p class="fleet__muted">Previous completed audit shown below</p></template>
                                <template lwc:if={row.isAuditing}><p class="fleet__muted" role="status">{row.progressLabel}</p></template>
                            </div>
                            <div class="fleet__action">
                                <template lwc:if={row.audited}><button class="button button--outline" data-id="open" data-planner={row.plannerId} onclick={handleOpen}>Open review <span aria-hidden="true">→</span></button></template>
                                <template lwc:else><button class="button button--primary" data-id="audit" data-planner={row.plannerId} onclick={handleAudit} disabled={row.auditDisabled}><template lwc:if={row.isAuditing}>Reviewing…</template><template lwc:else>Review bundle →</template></button></template>
                            </div>
                            <template lwc:if={row.rowError}><p class="fleet__error" data-id="row-error" role="alert">{row.rowError}</p></template>
                        </article>
                    </template>
                </div>
                <p class="fleet__key"><b>A</b> No material issue <b>B</b> Improvement opportunity <b>C</b> Priority fix <span>Unrated · More evidence needed</span></p>
            </template>
            <template lwc:if={isEmptyAfterLoad}><div class="fleet__state" data-id="empty"><h2>Your first bundle starts in Salesforce.</h2><p>Publish an Agent Script bundle, then refresh to find it here.</p><button class="button button--outline" onclick={handleRetry}>Refresh bundles →</button></div></template>
            <template lwc:if={isFilteredEmpty}><div class="fleet__state" data-id="empty-filtered"><h2>No bundles match.</h2><p>Try another search or clear your filters.</p><button class="button button--outline" onclick={handleClearFilters}>Clear filters →</button></div></template>
        </template>
    </section>
</template>
