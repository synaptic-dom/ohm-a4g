<template>
    <div class={containerClass}>
        <button
            type="button"
            role="switch"
            aria-checked={calmMode}
            class="ohm-calm-toggle__switch"
            onclick={handleToggle}
            data-id="calm-switch"
        >
            <span class="ohm-calm-toggle__label">Calm Mode</span>
            <span class="ohm-calm-toggle__track" aria-hidden="true">
                <span class="ohm-calm-toggle__thumb"></span>
            </span>
            <span class="ohm-calm-toggle__state" data-id="state-text">
                {stateText}
            </span>
        </button>
    </div>
</template>
