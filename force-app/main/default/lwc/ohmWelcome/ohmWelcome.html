<template>
    <section class="ohm-welcome" aria-labelledby="ohm-welcome-heading">
        <template lwc:if={showHero}>
            <div class="ohm-welcome__hero" aria-hidden="true"></div>
        </template>

        <h1
            id="ohm-welcome-heading"
            class="ohm-welcome__heading"
            data-focus-heading
            tabindex="-1"
        >

        </h1>

        <p class="ohm-welcome__copy">
