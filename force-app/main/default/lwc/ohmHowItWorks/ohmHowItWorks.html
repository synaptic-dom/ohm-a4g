            <ol class="how__steps">
                <li><b>Discover.</b> Ohm reads the published Agent Script bundles in the org and the prompt templates their actions call.</li>
                <li><b>Retrieve.</b> The exact published source comes back through the Metadata API using Ohm's own connected app and named credential, and every artifact is pinned by hash.</li>
                <li><b>Review.</b> A Prompt Builder template running GPT 5.5 reads the source and returns findings that quote it.</li>
                <li><b>Verify.</b> Apex checks each quote against the pinned source, confirms nothing changed since retrieval, applies the rating rules, and saves the review in one transaction. If any check fails, nothing is saved.</li>
                <li><b>Recommend.</b> Recommendations are generated from the saved review, each with what to change, what to keep, and how to test.</li>
                <li><b>Act.</b> One click creates a standard Salesforce Task keyed to the review. Re-audit reads the new published source and starts the loop again.</li>
            </ol>

        <article class="how__block how__block--grades" data-id="grades">
            <h2>Three questions, three grades</h2>
            <div class="how__grid">
                <div class="how__card"><h3>Input</h3><p>Is the model reading more than it needs? Repeated policy, padded context, instructions nobody uses.</p></div>
                <div class="how__card"><h3>Output</h3><p>Is it writing more than anyone asked for? Extra variants, extra formats, explanations no system consumes.</p></div>
                <div class="how__card"><h3>Calls</h3><p>Is it doing work plain code should do? Arithmetic, sorting, validation, retries that should be deterministic.</p></div>
            </div>
            <p class="how__legend"><b>A</b> clean in the reviewed evidence. <b>B</b> a change worth making. <b>C</b> a budget is being blown. <b>Unrated</b> evidence is missing, and it stays visible.</p>
