<template>
    <template lwc:if={isReady}>
        <div class="ohm-experience">
            <template lwc:if={isWelcome}>
                <c-ohm-welcome
                    onstartaudit={handleStart}
                    data-screen="welcome"
                    data-id="welcome"
                ></c-ohm-welcome>
            </template>

            <template lwc:if={isDiscoverAnalyze}>
                <c-ohm-discover-analyze
                    report-id={reportId}
                    run-status={runStatus}
                    stage-message={stageMessage}
                    percent-complete={percentComplete}
                    data-screen="discover"
                    data-id="discover"
                ></c-ohm-discover-analyze>
                <p class="ohm-experience__progress-note">You can leave this page. Progress resumes when you return.</p>
            </template>

            <template lwc:if={isImpact}>
                <c-ohm-review-panel review-json={reviewJson} data-screen="review" data-id="review-panel"></c-ohm-review-panel>
                <details class="ohm-experience__supporting" data-id="supporting-evidence"><summary>Supporting checks and assumptions</summary>
                <c-ohm-impact-readout
                    readout={readout}
                    onviewrecommendations={handleViewRecommendations}
                    data-id="impact"
                ></c-ohm-impact-readout>
                </details>
            </template>

            <template lwc:if={isRecommendations}>
                <div class="ohm-experience__recs">
                    <c-ohm-recommendations
                        findings={findings}
                        report-id={reportId}
                        volume-assumption={volumeAssumption}
                        telemetry-backed={telemetryBacked}
                        data-screen="recs"
                        data-id="recommendations"
                    ></c-ohm-recommendations>
                    <lightning-button
                        variant="neutral"
                        label="Back to review"
                        title="Back to review"
                        onclick={handleBack}
                        data-id="back-button"
                    ></lightning-button>
                </div>
            </template>

            <template lwc:if={isError}>
                <section
                    class="ohm-experience__error"
                    aria-labelledby="ohm-error-heading"
                >
                    <h2
                        id="ohm-error-heading"
                        data-focus-heading
                        tabindex="-1"
                    >
                        The audit hit a problem
                    </h2>
                    <p role="alert" data-id="error-message">{errorMessage}</p>
                    <p>{errorHelp}</p>
                    <template lwc:if={reportUrl}><p><a href={reportUrl} target="_blank" rel="noopener">Open this audit record ↗</a></p></template>
                    <lightning-button
                        variant="brand"
                        label={retryLabel}
                        title={retryLabel}
                        onclick={handleRetry}
                        data-id="retry-button"
                    ></lightning-button>
                </section>
            </template>
        </div>
    </template>
</template>
