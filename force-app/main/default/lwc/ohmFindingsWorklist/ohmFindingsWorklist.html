<template>
    <div class={hostClass} data-id="worklist-root">
        <!-- Controls ------------------------------------------------------- -->
        <div class="ohm-work__controls" role="group" aria-label="Supporting check filters">
            <label class="ohm-work__control">
                <span class="ohm-work__control-label">Status</span>
                <select
                    class="ohm-work__select"
                    data-id="filter-status"
                    onchange={handleStatusFilter}
                >
                    <template for:each={statusFilterOptions} for:item="opt">
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                </select>
            </label>

            <label class="ohm-work__control">
                <span class="ohm-work__control-label">Severity</span>
                <select
                    class="ohm-work__select"
                    data-id="filter-severity"
                    onchange={handleSeverityFilter}
                >
                    <template for:each={severityFilterOptions} for:item="opt">
                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                    </template>
                </select>
            </label>

            <button
                type="button"
                class="ohm-work__sort"
                data-id="sort-priority"
                onclick={handleSortToggle}
                aria-label="Sort by check priority"
            >
                Sort: {sortLabel}
            </button>
        </div>

        <!-- Loading -------------------------------------------------------- -->
        <template lwc:if={isLoading}>
            <div class="ohm-work__loading" data-id="loading" role="status">
                <span class="ohm-work__spinner" aria-hidden="true"></span>
                Loading tracked checks…
            </div>
        </template>

        <!-- Load error ----------------------------------------------------- -->
        <template lwc:if={loadError}>
            <div class="ohm-work__error" data-id="load-error" role="alert">
                <p>{loadError}</p>
                <button type="button" class="ohm-work__btn" onclick={handleRetry}>
                    Retry
                </button>
            </div>
        </template>

        <!-- Table ---------------------------------------------------------- -->
        <template lwc:if={hasRows}>
            <div class="ohm-work__table-wrap">
                <table class="ohm-work__table" data-id="table">
                    <thead>
                        <tr>
                            <th scope="col" class="ohm-work__th">Severity</th>
                            <th scope="col" class="ohm-work__th">Bundle / source</th>
                            <th scope="col" class="ohm-work__th">Check</th>
                            <th scope="col" class="ohm-work__th">Assignee</th>
                            <th scope="col" class="ohm-work__th">Due</th>
                            <th scope="col" class="ohm-work__th">Finding status</th>
                            <th scope="col" class="ohm-work__th"><span class="ohm-work__sr">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={visibleRows} for:item="row">
                            <tr key={row.findingId} class="ohm-work__tr" data-id="row">
                                <td class="ohm-work__td">
                                    <span class={row.severityClass}>
                                        <span class="ohm-work__chip-text">{row.severityText}</span>
                                    </span>
                                </td>
                                <td class="ohm-work__td ohm-work__td--process">
                                    <span class="ohm-work__process">{row.processText}</span>
                                    <template lwc:if={row.artifactText}>
                                        <span class="ohm-work__artifact">{row.artifactText}</span>
                                    </template>
                                </td>
                                <td class="ohm-work__td">{row.signalLabel}</td>
                                <td class="ohm-work__td" data-id="assignee">{row.assigneeText}</td>
                                <td class="ohm-work__td ohm-work__td--num" data-id="due">{row.dueText}</td>
                                <td class="ohm-work__td">
                                    <select
                                        class={row.statusClass}
                                        data-id="row-status"
                                        data-finding={row.findingId}
                                        disabled={row.isBusy}
                                        aria-label="Change finding status"
                                        onchange={handleRowStatusChange}
                                    >
                                        <template for:each={row.statusOptions} for:item="opt">
                                            <option
                                                key={opt.value}
                                                value={opt.value}
                                                selected={opt.selected}
                                            >{opt.label}</option>
                                        </template>
                                    </select>
                                </td>
                                <td class="ohm-work__td ohm-work__td--actions">
                                    <div class="ohm-work__actions">
                                        <template lwc:if={row.assigned}>
                                            <a class="ohm-work__assigned" href={row.taskUrl} title="Open task to edit owner or due date">{row.assignmentLabel} · Open task</a>
                                        </template>
                                        <template lwc:else>
                                            <button
                                                type="button"
                                                class="ohm-work__link"
                                                data-id="assign-toggle"
                                                data-finding={row.findingId}
                                                aria-expanded={row.assignOpen}
                                                onclick={handleToggleAssign}
                                            >
                                                Assign
                                            </button>
                                        </template>
                                        <template lwc:if={row.hasRecommendation}>
                                            <button
                                                type="button"
                                                class="ohm-work__link"
                                                data-id="expand"
                                                data-finding={row.findingId}
                                                aria-expanded={row.isExpanded}
                                                onclick={handleToggleExpand}
                                            >
                                                {row.expandLabel}
                                            </button>
                                        </template>
                                    </div>
                                </td>
                            </tr>

                            <!-- Assign inline form ---------------------------------- -->
                            <template lwc:if={row.assignOpen}>
                                <tr key={row.assignKey} class="ohm-work__subrow" data-id="assign-row">
                                    <td class="ohm-work__td ohm-work__td--sub" colspan="7">
                                        <div class="ohm-work__assign">
                                            <label class="ohm-work__control">
                                                <span class="ohm-work__control-label">Due date</span>
                                                <input
                                                    type="date"
                                                    class="ohm-work__date"
                                                    data-id="assign-date"
                                                    data-finding={row.findingId}
                                                    value={row.assignDate}
                                                    onchange={handleDateChange}
                                                />
                                            </label>
                                            <button
                                                type="button"
                                                class="ohm-work__btn ohm-work__btn--primary"
                                                data-id="assign-me"
                                                data-finding={row.findingId}
                                                disabled={row.isBusy}
                                                onclick={handleAssignToMe}
                                            >
                                                <template lwc:if={row.isBusy}>Assigning…</template>
                                                <template lwc:else>Assign to me</template>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>

                            <!-- Recommendation detail ------------------------------- -->
                            <template lwc:if={row.isExpanded}>
                                <tr key={row.detailKey} class="ohm-work__subrow" data-id="detail-row">
                                    <td class="ohm-work__td ohm-work__td--sub" colspan="7">
                                        <p class="ohm-work__reco" data-id="reco">
                                            {row.recommendationText}
                                        </p>
                                    </td>
                                </tr>
                            </template>

                            <!-- Row error ------------------------------------------- -->
                            <template lwc:if={row.rowError}>
                                <tr key={row.errKey} class="ohm-work__subrow">
                                    <td class="ohm-work__td ohm-work__td--sub" colspan="7">
                                        <p class="ohm-work__row-error" data-id="row-error" role="alert">
                                            {row.rowError}
                                        </p>
                                    </td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <!-- Empty states --------------------------------------------------- -->
        <template lwc:if={isEmpty}>
            <div class="ohm-work__empty" data-id="empty">
                <template lwc:if={isFiltered}>
                    No supporting checks match these filters.
                </template>
                <template lwc:else>
                    No supporting check findings are waiting here. Current review recommendations appear above.
                </template>
            </div>
        </template>
    </div>
</template>
