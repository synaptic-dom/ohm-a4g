<template>
    <div class={hostClass} data-id="process-root">
        <button type="button" class="ohm-process__back" data-id="back" onclick={handleBack}>← All bundles</button>
        <template lwc:if={isLoading}><c-ohm-loading-state heading="Opening your bundle" detail="Loading the published source and its latest review." data-id="loading"></c-ohm-loading-state></template>
        <template lwc:if={loadError}><div class="ohm-process__error" data-id="load-error" role="alert"><p>{loadError}</p><button type="button" class="ohm-process__btn" onclick={handleRetry}>Try again</button></div></template>
        <template lwc:if={auditRun}><c-ohm-audit-progress run={auditRun} onretry={handleAuditRetry} data-id="run-progress"></c-ohm-audit-progress></template>
        <template lwc:if={hasDetail}>
            <header class="ohm-process__header" data-id="context-header">
                <div class="ohm-process__identity"><p class="ohm-process__scope" data-id="audit-scope">Published Agent Script bundle</p><h1 class="ohm-process__title" data-id="process-label">{label}</h1><p class="ohm-process__subline">Linked prompts included <template lwc:if={domain}>· {domain}</template></p></div>
                <div class="ohm-process__actions"><template lwc:if={isAudited}><button type="button" class="ohm-process__btn" data-id="reaudit" onclick={handleReaudit} disabled={isReauditing}><template lwc:if={isReauditing}>Re-auditing…</template><template lwc:else>Re-audit ↗</template></button></template><template lwc:else><button type="button" class="ohm-process__btn ohm-process__btn--primary" data-id="audit-cta" onclick={handleReaudit} disabled={isReauditing}><template lwc:if={isReauditing}>Auditing…</template><template lwc:else>Audit this bundle ↗</template></button></template></div>
            </header>
            <template lwc:if={auditPendingNotice}><p class="ohm-process__pending-note" data-id="pending-results">Your review will appear here when the audit finishes.</p></template>
            <template lwc:if={showAuditResults}>
                <c-ohm-footprint-strip class="ohm-process__footprint" heading="What this bundle can stop costing the planet" scope="bundle" footprints={footprints} factors={impactFactors} assumption-summary={impactAssumptions} data-id="footprint"></c-ohm-footprint-strip>
                <c-ohm-review-panel review-json={reviewJson} onreviewaction={handleReviewAction} data-id="review-panel"></c-ohm-review-panel>
                <details class="ohm-process__workspace" open={showWorkspace} ontoggle={handleWorkspaceToggle} data-id="source-workspace">
                    <summary>Source workspace <span>Inspect instructions and work through a change</span></summary>
                    <template lwc:if={showWorkspace}>
                        <div class="ohm-process__workspace-head"><h2 data-id="workspace-heading" tabindex="-1">{selectedSourceLabel}</h2><label class="ohm-process__source-select">Source<select data-id="source-select" onchange={handleSourceChange}><option value="">Select a source</option><template for:each={sourceOptions} for:item="option"><option key={option.value} value={option.value} selected={option.selected}>{option.label}</option></template></select></label></div>
                        <div class="ohm-process__grid"><section class="ohm-process__inspector-pane" aria-label="Published source"><c-ohm-node-inspector node={selectedNode} finding={selectedFinding} report-id={reportId} onasksource={handleAskSource} data-id="node-inspector"></c-ohm-node-inspector></section><aside class="ohm-process__assistant-pane" aria-label="Ask Ohm"><c-ohm-ask-assistant planner-id={plannerId} artifact-key={selectedArtifactKey} expected-source-hash={selectedSourceHash} process-label={label} data-id="ask-assistant"></c-ohm-ask-assistant></aside></div>
                    </template>
                </details>
                <details class="ohm-process__supporting" data-id="structure"><summary>Bundle structure <span>Topics, actions, and dependencies</span></summary><section class="ohm-process__graph-pane" aria-label="Bundle structure"><p class="ohm-process__structure-note">Placement does not establish execution order or call counts.</p><c-ohm-call-graph nodes={nodes} selected-node-id={selectedNodeId} onselectnode={handleSelectNode} data-id="call-graph"></c-ohm-call-graph></section></details>
                <details class="ohm-process__supporting" data-id="supporting-evidence"><summary>Supporting evidence <span>Detector checks and modeled impact</span></summary><section class="ohm-process__evidence" aria-label="Detector checks and modeled impact" data-id="coverage"><p><strong>Detector coverage: {coverageStatus}</strong></p><ul><template for:each={detectorCoverage} for:item="item"><li key={item.key}>{item.text}</li></template></ul><template for:each={coverageWarnings} for:item="warning"><p key={warning}>{warning}</p></template><template lwc:if={showSummaryMetrics}><p data-id="legacy-grade">Legacy detector grade: {grade} · {gradeWord}. Separate from the efficiency review.</p><p>Modeled input scenario: <span data-id="process-energy">{energyText}</span></p></template><p>{impactScope} · {impactRange}</p><p>{impactAssumptions}</p></section></details>
                <template lwc:if={canCompare}><section class="ohm-process__diff" data-id="diff-section"><button type="button" class="ohm-process__text-btn" data-id="compare-toggle" onclick={handleToggleDiff} aria-expanded={showDiff}>{compareToggleLabel}</button><template lwc:if={showDiff}><c-ohm-diff-view planner-id={plannerId} artifact-key={selectedArtifactKey} data-id="diff-view"></c-ohm-diff-view></template></section></template>
            </template>
        </template>
    </div>
</template>
