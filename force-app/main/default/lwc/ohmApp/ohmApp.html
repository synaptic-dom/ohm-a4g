<template>
    <div class="ohm-app" data-id="shell">
        <header class="ohm-app__topbar">
            <button class="ohm-app__brand" onclick={handleHome} aria-label="Ohm overview"><span class="ohm-app__symbol" aria-hidden="true">Ω</span><span class="ohm-app__wordmark">ohm<span class="ohm-app__period">.</span></span></button>
            <div class="ohm-app__tabs" role="tablist" aria-label="Ohm sections" onkeydown={handleTabKeydown}>
                <template for:each={tabs} for:item="tab"><button key={tab.id} type="button" role="tab" class={tab.cssClass} data-tab={tab.id} data-id="tab" aria-selected={tab.selected} aria-controls="workspace" tabindex={tab.tabindex} onclick={handleTabClick}>{tab.label}</button></template>
            </div>
            <span class="ohm-app__signature"><span aria-hidden="true"></span>Agentforce efficiency</span>
        </header>
        <main id="workspace" class="ohm-app__body" role="tabpanel" aria-label={activePanelLabel} tabindex="0">
            <template lwc:if={isOverview}><c-ohm-overview onnavigate={handleNavigate} onopenprocess={handleOpenProcess} data-id="overview"></c-ohm-overview></template>
            <template lwc:if={isFleetList}><c-ohm-fleet-table onopenprocess={handleOpenProcess} data-id="fleet"></c-ohm-fleet-table></template>
            <template lwc:if={isProcessOpen}><c-ohm-process-page planner-id={selectedPlannerId} initial-node-id={selectedNodeId} initial-artifact-key={selectedArtifactKey} initial-intent={selectedIntent} initial-question={selectedQuestion} onbacktofleet={handleBackToFleet} data-id="process-page"></c-ohm-process-page></template>
            <template lwc:if={isRecommendations}><c-ohm-recommendations standalone onopenprocess={handleOpenProcess} onnavigate={handleNavigate} data-id="recommendations"></c-ohm-recommendations></template>
            <template lwc:if={isHow}><c-ohm-how-it-works data-id="how"></c-ohm-how-it-works></template>
        </main>
        <footer class="ohm-app__footer"><span>Less waste. More intention.</span><span>Built for Agentforce</span></footer>
    </div>
</template>
